name: Android build

on:
  push:
    branches:
      - feature/radar-android-mvp
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test, lint and assemble APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 37 and build tools
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Run tests, lint and build debug APK
        run: ./gradlew --no-daemon --max-workers=2 --no-parallel -Pkotlin.compiler.execution.strategy=in-process --stacktrace --info --continue testDebugUnitTest lintDebug assembleDebug

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: radar-nacional-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14
